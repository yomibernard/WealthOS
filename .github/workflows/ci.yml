name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test · build · release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: file:./dev.db
      DEMO_MODE: "true"
      SESSION_SECRET: wealthos-ci-session-secret-not-for-prod
      BASE_CURRENCY: NGN
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Database setup (SQLite)
        run: npm run db:setup

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Release check (dev profile)
        run: npm run release:check
